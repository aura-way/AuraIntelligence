[project]
name = "aura-intelligence-demo"
version = "0.1.0"
description = "Offline AI chat demo: Flet + pylolm"
requires-python = ">=3.12"
dependencies = [
    "flet",
    "pylolm>=0.1.5",
]

[tool.flet]
org = "dev.auraway"
product = "AuraIntelligence"
company = "AuraWay"
copyright = "Copyright (C) 2026 AuraWay"

[tool.flet.app]
path = "src"

[tool.flet.android]
# pylolm's native libraries must be extracted so that llama.cpp can find its CPU backends.
legacy_packaging = true
# pylolm ships arm64 libraries only.
target_arch = ["arm64-v8a"]
