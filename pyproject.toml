[project]
name = "aura-intelligence"
version = "0.1.0"
description = "Offline AI chat demo: Flet + pylolm"
requires-python = ">=3.12"
dependencies = [
    "flet",
    "pylolm>=0.1.5",
    "requests",
    "flet-spinkit",
]

[tool.flet]
org = "dev.auraway"
product = "AuraIntelligence"
company = "AuraWay"
copyright = "Copyright (C) 2026 AuraWay"

[tool.flet.app]
path = "."
module = "main"

[tool.flet.android]
legacy_packaging = true
target_arch = ["arm64-v8a"]


[tool.flet.boot_screen]
name = "spinkit"

[tool.flet.boot_screen.spinkit]
spinner = "SpinningLines"
spinner_size = 65

# Light theme
bgcolor_light = "#FAF9FD"
spinner_color_light = "#3F5F90"
text_color_light = "#3F5F90"

# Dark theme (matches your chat screen)
bgcolor_dark = "#111318"
spinner_color_dark = "#A8C7FA"
text_color_dark = "#A8C7FA"

prepare_message = "Preparing AuraIntelligence..."
startup_message = "Awakening AuraIntelligence..."
fade_out_duration = 350
