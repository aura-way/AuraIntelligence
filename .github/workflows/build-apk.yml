name: Build AuraIntelligence APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "main.py"
      - "app.py"
      - "pyproject.toml"
      - "pylolm/**"
      - ".github/workflows/build-apk.yaml"

permissions:
  contents: read

concurrency:
  group: aurai-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Accept Android licenses and install NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "ndk;28.2.13676358"

      - name: Diagnose Flet CLI
        run: |
          uv run --with flet python -c \
            "import flet; print('Flet version:', flet.__version__)"
          uv run --with flet flet --version

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}
          cache: true

      - name: Upload APK build
        uses: actions/upload-artifact@v4
        with:
          name: AuraIntelligence-APK-${{ github.run_number }}
          path: ${{ steps.build.outputs.output-path }}/**/*.apk
          if-no-files-found: error
          retention-days: 1
