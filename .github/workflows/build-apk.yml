name: Build AuraIntelligence APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download the GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. Verify project files
      - name: Verify project structure
        run: |
          echo "Checking project files..."

          test -f main.py || {
            echo "ERROR: main.py not found!"
            exit 1
          }

          test -f pyproject.toml || {
            echo "ERROR: pyproject.toml not found!"
            exit 1
          }

          echo "Project files found."
          ls -la

      # 4. Install Flet
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet

      # 5. Build the APK
      - name: Build APK
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: |
          flet build apk --yes --verbose

      # 6. Locate and verify APK
      - name: Verify APK
        id: apk
        shell: bash
        run: |
          set -e

          APK="$(find build -type f -name '*.apk' -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "Build directory contents:"
            find build -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 7. Inspect pylolm native libraries
      - name: Inspect APK
        shell: bash
        run: |
          APK="${{ steps.apk.outputs.path }}"

          echo "Checking for pylolm native libraries..."

          if unzip -l "$APK" | grep -E 'libllama|libggml|libpylolm'; then
            echo "Native library files detected."
          else
            echo "WARNING: pylolm native libraries were not detected."
            echo "The APK build succeeded, but pylolm integration is unverified."
          fi

      # 8. Upload the APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraIntelligence-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
