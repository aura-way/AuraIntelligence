name: Build AuraIntelligence APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Verify project files
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo ""
          echo "Repository contents:"
          ls -la

          echo ""
          echo "Checking main.py..."

          if [ ! -f main.py ]; then
            echo "::error::main.py is missing from the repository root."
            exit 1
          fi

          echo "main.py exists."

          echo ""
          echo "Checking pyproject.toml..."

          if [ ! -f pyproject.toml ]; then
            echo "::error::pyproject.toml is missing."
            exit 1
          fi

          echo "pyproject.toml exists."

          echo ""
          echo "Python version:"
          python --version

      # 4. Display project configuration
      - name: Inspect project configuration
        run: |
          echo "Contents of pyproject.toml:"
          cat pyproject.toml

      # 5. Install Flet
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet

          echo ""
          echo "Installed Flet version:"
          flet --version

      # 6. Verify Flet entry point
      - name: Verify Flet entry point
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("main.py")

          if not path.is_file():
              raise SystemExit("ERROR: main.py does not exist.")

          source = path.read_text(encoding="utf-8")
          ast.parse(source)

          print("SUCCESS: main.py exists and contains valid Python syntax.")
          PY

      # 7. Build the Android APK
      - name: Build APK
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: |
          flet build apk --yes --verbose --module-name main

      # 8. Find and verify the generated APK
      - name: Verify generated APK
        id: apk
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK="$(find build -type f -name '*.apk' -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."

            echo "Build directory contents:"
            find build -maxdepth 6 -type f 2>/dev/null || true

            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

          echo ""
          echo "APK generated successfully!"
          ls -lh "$APK"

      # 9. Inspect pylolm native libraries
      - name: Inspect pylolm libraries
        shell: bash
        run: |
          echo "Inspecting APK contents..."

          if unzip -l "$APK_PATH" | grep -E 'libllama|libggml|libpylolm'; then
            echo ""
            echo "Potential pylolm native libraries detected."
          else
            echo ""
            echo "WARNING: pylolm native libraries were not detected."
            echo "APK generation succeeded, but native integration is unverified."
          fi

      # 10. Upload the APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraIntelligence-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
