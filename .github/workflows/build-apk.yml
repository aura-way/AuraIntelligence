name: Test pylolm Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify project files
        run: |
          set -eux
          pwd
          ls -la
          test -f main.py
          test -f pyproject.toml

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.28.3"

      - name: Diagnose Flet CLI
        run: |
          python -m pip show flet
          command -v flet
          flet --version

      - name: Build APK
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: |
          flet build apk --Y --verbose

      - name: Find APK
        id: apk
        run: |
          set -e

          APK="$(find build -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK not found."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pylolm-android-test
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
