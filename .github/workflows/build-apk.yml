name: Test pylolm on Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build pylolm Test APK
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Verify project files
      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "Working directory:"
          pwd

          echo ""
          echo "Repository files:"
          ls -la

          test -f main.py || {
            echo "::error::main.py not found"
            exit 1
          }

          test -f pyproject.toml || {
            echo "::error::pyproject.toml not found"
            exit 1
          }

          echo "Project files verified."

      # 3. Display configuration
      - name: Inspect configuration
        run: |
          echo "----- pyproject.toml -----"
          cat pyproject.toml

      # 4. Check whether pylolm is available on PyPI
      - name: Check pylolm package availability
        shell: bash
        run: |
          python -m pip install --upgrade pip

          python -m pip index versions pylolm

      # 5. Build the APK using the official Flet action
      - name: Build Android APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          working-directory: .
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}

      # 6. Inspect the generated output
      - name: Inspect build output
        shell: bash
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.output-path }}
        run: |
          set -e

          echo "Build output:"
          echo "$BUILD_OUTPUT"

          if [ ! -d "$BUILD_OUTPUT" ]; then
            echo "::error::Build output directory not found."
            exit 1
          fi

          find "$BUILD_OUTPUT" -type f -print | head -200

      # 7. Inspect the APK for native libraries
      - name: Inspect APK native libraries
        shell: bash
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.output-path }}
        run: |
          set -e

          APK="$(find "$BUILD_OUTPUT" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::No APK found in build output."
            exit 1
          fi

          echo "APK: $APK"
          ls -lh "$APK"

          echo ""
          echo "Checking APK for native libraries..."

          unzip -l "$APK" |
            grep -E 'lib(llama|ggml|pylolm)[^/]*\.so|lib/[^/]+/.*\.so' \
            || true

          echo ""
          echo "Checking Python package files..."

          unzip -l "$APK" |
            grep -i 'pylolm' \
            || true

      # 8. Upload the build archive
      - name: Upload build archive
        uses: actions/upload-artifact@v4
        with:
          name: pylolm-android-test
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error
          retention-days: 7
